name: Build DEB Package

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Package Structure
        run: |
          mkdir -p package_root/DEBIAN
          mkdir -p package_root/usr/libexec/stash933

          # Копируем control в системную папку пакета
          cp control package_root/DEBIAN/

          # Копируем остальные файлы репозитория в структуру
          cp csstashedappexecutable package_root/usr/libexec/stash933/ || true
          cp *.mm package_root/usr/libexec/stash933/ || true
          cp *.h package_root/usr/libexec/stash933/ || true

          # Задаем правильные права
          chmod -R 755 package_root/DEBIAN

      - name: Build DEB
        run: |
          mkdir -p packages
          dpkg-deb --build package_root packages/com.coolstar.stashing_1.5.0_iphoneos-arm.deb

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stashing-deb
          path: packages/*.deb
