name: Build DEB Package

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies & Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl git make
          git clone --recursive https://github.com/theos/theos.git /opt/theos

      - name: Build Package
        run: |
          /opt/theos/bin/make package FINALPACKAGE=1 THEOS=/opt/theos

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stashing-deb
          path: packages/*.deb
