name: Build DEB Package

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build DEB
        run: |
          mkdir -p build/DEBIAN
          mkdir -p build/usr/libexec/stash933
          
          # Копируем служебные файлы пакета
          cp -r DEBIAN/* build/DEBIAN/
          
          # Копируем бинарник и исходники в структуру
          cp csstashedappexecutable build/usr/libexec/stash933/ || true
          cp *.mm build/usr/libexec/stash933/ || true
          cp *.h build/usr/libexec/stash933/ || true
          
          # Выставляем права и собираем deb
          chmod -R 755 build/DEBIAN
          dpkg-deb --build --root-owner-group build package.deb

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: stashing-deb
          path: package.deb
